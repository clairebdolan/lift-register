<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift Register</title>

<style>
  :root {
    --bg: #EDEEEC;
    --card: #FFFFFF;
    --ink: #16191A;
    --ink-2: #566063;
    --ink-3: #869092;
    --line: #D3D8D5;
    --accent: #1B6873;
    --serial: #8A3F2B;
    --good: #2E6B45;
    --good-bg: #DCEBE2;
    --warn: #8A5A17;
    --warn-bg: #F4E9D8;
    --off: #6B7477;
    --off-bg: #E3E6E5;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: 20px 18px 60px;
  }

  .wrap { max-width: 520px; margin: 0 auto; }

  .brand {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }

  .card-top {
    padding: 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Temporary build-time label — greyed down so it cannot be mistaken for
     the unit number. Deleted before the field pilot. */
  .code {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--ink-3);
  }

  /* Vendor descriptions are long and all-caps, so this is sized to fit one
     on a phone without wrapping to three lines. */
  h1 { font-size: 21px; line-height: 1.25; margin: 0; letter-spacing: 0; }

  .pill {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 3px;
  }
  .pill.active     { background: var(--good-bg); color: var(--good); }
  .pill.calledoff  { background: var(--warn-bg); color: var(--warn); }
  .pill.pickedup   { background: var(--off-bg);  color: var(--off);  }

  dl { margin: 0; }

  /* One line per fact, reading "Label: value" left to right.
     The two number rows carry a coloured bar so a glance tells them apart. */
  .row {
    padding: 13px 20px;
    border-bottom: 1px solid var(--line);
    border-left: 4px solid transparent;
  }
  .row:last-child { border-bottom: none; }
  .row.unit   { border-left-color: var(--accent); }
  .row.serial { border-left-color: var(--serial); }

  .row .k {
    font-size: 16px;
    font-weight: 500;
    color: var(--ink-2);
  }
  .row .v {
    font-size: 17px;
    font-weight: 650;
    color: var(--ink);
    word-break: break-word;
  }
  .row .v.mono { font-family: var(--mono); font-size: 19px; letter-spacing: 0.02em; }
  .row.unit   .v { color: var(--accent); }
  .row.serial .v { color: var(--serial); }

  /* Says where the number comes from, so nobody reads the wrong one off
     the machine. Colour alone is not enough of a difference. */
  .row .hint {
    display: block;
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--ink-3);
    font-weight: 400;
  }

  .note {
    margin-top: 22px;
    font-size: 14px;
    color: var(--ink-2);
  }

  a { color: var(--accent); }

  /* the list you see when no machine is specified */
  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .list a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 15px 18px;
    text-decoration: none;
    color: var(--ink);
  }
  .list a:active { background: var(--bg); }
  .list .lbl { font-weight: 600; font-size: 15px; }
  .list .sub { font-size: 13px; color: var(--ink-3); }
  .list .qr { font-family: var(--mono); font-size: 14px; color: var(--accent); }

  .lede { color: var(--ink-2); font-size: 15px; margin: 0 0 18px; }

  .missing { padding: 26px 20px; text-align: center; }
  .missing h1 { font-size: 22px; margin-bottom: 8px; }
  .missing p { color: var(--ink-2); font-size: 15px; margin: 0; }

  footer {
    margin-top: 34px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
</style>
</head>

<body>
<div class="wrap">
  <div class="brand">Lift Register</div>

  <!-- Everything below gets filled in by the script at the bottom. -->
  <div id="app"></div>

  <footer>Prototype — sample data only</footer>
</div>

<script>
// ---------------------------------------------------------------------------
// 1. THE MACHINES
//
// Fake machines for testing. Later this comes from a real database; for now
// it's just a list written into the page. "qr" is the code printed on the tag.
//
// "desc" is deliberately the vendor's own wording, copied off the rental
// agreement, so what the operator sees matches what shows up on the invoice.
// ---------------------------------------------------------------------------

const MACHINES = [
  { qr: "A4X7", desc: "MANLIFT-25' SELF PROP ELECTRIC",     vendor: "Sunstate",        unit: "1044821",   serial: "GS2632-181422",  status: "active"    },
  { qr: "B2K9", desc: "SCISSORLIFT-32' ELECTRIC NARROW",    vendor: "United Rentals",  unit: "7719340",   serial: "GS3246-905118",  status: "active"    },
  { qr: "C8M3", desc: "BOOMLIFT-60' TELESCOPIC 4WD DIESEL", vendor: "Texas First",     unit: "TF-40218",  serial: "S60XC-330281",   status: "active"    },
  { qr: "D5R1", desc: "SCISSORLIFT-19' ELECTRIC",           vendor: "Equipment Share", unit: "4420118",   serial: "GS1930-772904",  status: "calledoff" },
  { qr: "E7T4", desc: "BOOMLIFT-45' ARTICULATING DIESEL",   vendor: "Opifex",          unit: "OPX-11877", serial: "Z45-25J-118773", status: "active"    },
  { qr: "F1W8", desc: "SCISSORLIFT-40' RT DIESEL",          vendor: "Sunstate",        unit: "1044977",   serial: "GS4047-661209",  status: "pickedup"  }
];

// Friendly wording for each status code.
const STATUS_LABEL = {
  active:    "On rent",
  calledoff: "Called off",
  pickedup:  "Picked up"
};


// ---------------------------------------------------------------------------
// 2. WHICH MACHINE WAS SCANNED?
//
// The QR tag encodes a web address ending in ?id=A4X7
// This pulls that "A4X7" back out of the address bar.
// If there's no id in the address, scannedId is null.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// OFFLINE
//
// Hand sw.js to the phone. From here on the phone keeps its own copy of this
// app and can open it with no signal. This is the only line index.html needs
// — everything about what gets stored lives in sw.js.
//
// The "if" is there because a browser that has never heard of service workers
// should still show the app, just without the offline part.
// ---------------------------------------------------------------------------

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}


const scannedId = new URLSearchParams(window.location.search).get("id");

// Look through the list for a machine whose qr code matches.
// toUpperCase() so a lowercase ?id=a4x7 still works.
const machine = MACHINES.find(m => m.qr === (scannedId || "").toUpperCase());


// ---------------------------------------------------------------------------
// 3. PUT SOMETHING ON THE SCREEN
//
// Three possible situations, handled in order.
// ---------------------------------------------------------------------------

const app = document.getElementById("app");

if (!scannedId) {
  // Nothing was scanned — someone opened the plain address.
  // Show the test list so you can tap through without a printed tag.
  app.innerHTML = `
    <p class="lede">No machine scanned. Pick one to preview what an operator
    sees after scanning its tag.</p>
    <div class="list">
      ${MACHINES.map(m => `
        <a href="?id=${m.qr}">
          <span>
            <span class="lbl">${m.desc}</span><br>
            <span class="sub">${m.vendor} &middot; ${m.unit}</span>
          </span>
          <span class="qr">${m.qr}</span>
        </a>
      `).join("")}
    </div>`;

} else if (!machine) {
  // A code was scanned but it isn't one we know.
  app.innerHTML = `
    <div class="card missing">
      <h1>Machine not found</h1>
      <p>Tag <strong>${scannedId}</strong> isn't in the register.
      It may not have been checked in yet.</p>
    </div>
    <p class="note"><a href="?">See all machines</a></p>`;

} else {
  // Found it. Show the machine.
  app.innerHTML = `
    <div class="card">
      <div class="card-top">
        <!-- TODO before the field pilot: DELETE this tag code line.
             It is here only while we are building, so we can tell which
             sample machine we are looking at. An operator has no use for it
             and it will get confused with the unit number. -->
        <div class="code">TAG ${machine.qr}</div>
        <h1>${machine.desc}</h1>
        <span class="pill ${machine.status}">${STATUS_LABEL[machine.status]}</span>
      </div>
      <dl>
        <div class="row">
          <span class="k">Vendor:</span>
          <span class="v">${machine.vendor}</span>
        </div>
        <div class="row unit">
          <span class="k">Unit Number:</span>
          <span class="v mono">${machine.unit}</span>
          <span class="hint">The vendor's sticker number</span>
        </div>
        <div class="row serial">
          <span class="k">Serial Number:</span>
          <span class="v mono">${machine.serial}</span>
          <span class="hint">Stamped on the machine's plate</span>
        </div>
      </dl>
    </div>
    <p class="note">
      Scanning works. Next step is the form that records who is using it and where.
      <br><a href="?">See all machines</a>
    </p>`;
}
</script>
</body>
</html>
